<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <style>
    body {
      width: 260px;
      margin: 0;
      padding: 14px;
      background: #181825;
      color: #cdd6f4;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      font-size: 13px;
    }
    h3 {
      margin: 0 0 12px 0;
      font-size: 14px;
      color: #89b4fa;
    }
    label {
      display: block;
      margin-bottom: 4px;
      color: #a6adc8;
      font-size: 12px;
    }
    select {
      width: 100%;
      padding: 6px;
      margin-bottom: 12px;
      background: #313244;
      color: #cdd6f4;
      border: 1px solid #45475a;
      border-radius: 6px;
      outline: none;
    }
    .checkbox-row {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 12px;
      cursor: pointer;
    }
    .shortcuts {
      background: #1e1e2e;
      border: 1px solid #313244;
      border-radius: 6px;
      padding: 8px;
      font-size: 11px;
      color: #a6adc8;
      line-height: 1.5;
    }
    kbd {
      background: #313244;
      padding: 1px 5px;
      border-radius: 4px;
      color: #cdd6f4;
    }
  </style>
</head>
<body>
  <h3>Configurações do Tradutor</h3>

  <label for="voiceSelect">Voz em Inglês:</label>
  <select id="voiceSelect">
    <option value="">Padrão do Sistema (en-US)</option>
  </select>

  <label for="rateSelect">Velocidade do Áudio:</label>
  <select id="rateSelect">
    <option value="0.75">0.75x (Mais devagar)</option>
    <option value="0.9">0.9x (Natural pausado)</option>
    <option value="1.0" selected>1.0x (Normal)</option>
    <option value="1.25">1.25x (Rápido)</option>
  </select>

  <label class="checkbox-row">
    <input type="checkbox" id="autoReplace" />
    <span>Substituir texto direto na página ao apertar Ctrl</span>
  </label>

  <div class="shortcuts">
    <div><kbd>Alt</kbd> ou clique no ícone: Ouvir em inglês</div>
    <div><kbd>Ctrl</kbd>: Traduzir para PT-BR</div>
    <div><kbd>Esc</kbd>: Fechar balão</div>
  </div>

  <script src="popup.js"></script>
</body>
</html>
